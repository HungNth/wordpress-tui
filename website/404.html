<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1017">
  <title>Page not found - WPTUI</title>
  <link rel="icon" href="/wordpress-tui/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #0b1017;
      color: #edf2f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      padding: 1.75rem;
      background: #111822;
      border: 1px solid #253346;
      border-radius: 8px;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #38d9f5;
    }
    h1 { margin: 0.4rem 0 0.65rem; font-size: 1.5rem; line-height: 1.2; }
    p { margin: 0 0 1.25rem; color: #9fb0c3; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #38d9f5; outline-offset: 2px; }
    .primary { background: #2271b1; color: #ffffff; }
    .primary:hover { background: #1b5e96; }
    .secondary { background: #16202e; color: #edf2f7; border: 1px solid #253346; }
    .secondary:hover { border-color: #4aa8e8; }
  </style>
</head>
<body>
  <main>
    <span class="code">HTTP 404</span>
    <h1>Page not found</h1>
    <p>That path does not exist on the WPTUI site.</p>
    <div class="actions">
      <a class="primary" href="/wordpress-tui/">Back to WPTUI</a>
      <a class="secondary" href="https://github.com/HungNth/wordpress-tui">View on GitHub</a>
    </div>
  </main>
</body>
</html>
