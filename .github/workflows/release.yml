name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and manifest
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f manifest.json ]]; then
            echo "::error::manifest.json not found"
            exit 1
          fi

          MANIFEST_NAME="$(jq -r .name manifest.json)"
          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "${MANIFEST_NAME}" != "wptui" ]]; then
            echo "::error::manifest.json name '${MANIFEST_NAME}' does not match expected 'wptui'"
            exit 1
          fi

          SEMVER_REGEX="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$"
          if [[ ! "${TAG_VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::tag version '${TAG_VERSION}' is not valid semantic versioning"
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match manifest version '${MANIFEST_VERSION}'"
            exit 1
          fi

          VERSION_NO_BUILD="${TAG_VERSION%%+*}"
          if [[ "${VERSION_NO_BUILD}" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run test suite with race detector
        run: go test -race ./...

      - name: Cross-compile and package release assets
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="$PWD"
          VERSION="$(jq -r .version manifest.json)"
          NAME="$(jq -r .name manifest.json)"
          DIST_DIR="${ROOT_DIR}/dist"
          mkdir -p "${DIST_DIR}"

          TARGETS=(
            "darwin amd64"
            "darwin arm64"
            "windows amd64 .exe"
          )

          for TARGET in "${TARGETS[@]}"; do
            read -r GOOS GOARCH EXT <<< "$TARGET"
            BIN_NAME="${NAME}${EXT}"
            STAGE_DIR="${ROOT_DIR}/stage_${GOOS}_${GOARCH}"
            ASSET="${NAME}_${VERSION}_${GOOS}_${GOARCH}.zip"

            rm -rf "${STAGE_DIR}"
            mkdir -p "${STAGE_DIR}"

            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath -ldflags="-s -w" -o "${STAGE_DIR}/${BIN_NAME}" ./cmd/wptui

            chmod +x "${STAGE_DIR}/${BIN_NAME}"

            (cd "${STAGE_DIR}" && zip -q "${DIST_DIR}/${ASSET}" "${BIN_NAME}")
            rm -rf "${STAGE_DIR}"
          done

          cd "${DIST_DIR}"
          sha256sum *.zip | sort -k 2 > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.validate.outputs.prerelease == 'true' }}
          files: |
            dist/*.zip
            dist/checksums.txt
